.icons a:hover,.icons a:focus-visible{color:#fff;background:var(--accent);transform:translateY(-3px);outline:none}
.icons a:focus-visible{box-shadow:0 0 0 3px rgba(31,122,224,.45)}
.icons svg{width:22px;height:22px;fill:currentColor}
.icons svg.st{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.icons a{transition:none}}

(function(){

function size(){var d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);var n=Math.round(Math.min(70,W*H/16000));P=[];for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()<.15?3:1.6})}

})();
